$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'go'
id: 'tui'

fileGroups:
  sources:
    - 'cmd/**/*.go'
    - 'internal/**/*.go'
  tests:
    - '**/*_test.go'
  configs:
    - 'go.mod'
    - 'go.sum'

tasks:
  install:
    script: |
      go install -trimpath -ldflags "
        -X 'main.buildVersion=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)+dev'
        -X 'main.buildDate=$(date -u '+%Y-%m-%d %H:%M:%S %Z')'
        -X 'main.buildCommit=$(git rev-parse HEAD)'
      " ./cmd/kargo-tui
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  lint:
    script: 'go mod tidy && golangci-lint run'
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  test:
    command: 'go test ./...'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'

  build:
    command: 'go build -o /dev/null ./...'
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  mock-server:
    command: 'go run ./cmd/kargo-mock-server'
    local: true
