name: Release

on:
  release:
    types: [published]
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: "https://proxy.golang.org"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release
    if: ${{ github.repository == 'unknwon/kargo-tui' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - name: Check out code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Determine version
        id: version
        run: |
          # Need tags reachable so `git describe` can find them.
          git fetch --tags --depth=1 origin || true

          # closest_tag is the nearest annotated/lightweight tag reachable
          # from HEAD; empty if no tags exist.
          closest_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ "${{ github.event_name }}" = "release" ]; then
            release_tag="${{ github.event.release.tag_name }}"
            # version is the archive-name slug (no leading v).
            version="${release_tag#v}"
            # build_version is the literal release tag, stamped into the binary.
            build_version="$release_tag"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            release_tag="latest-commit-build"
            version="$(git rev-parse --short HEAD)"
            build_version="${closest_tag:-dev}+dev"
          else
            release_tag="release-archive-testing"
            version="$(git rev-parse --short HEAD)"
            build_version="${closest_tag:-dev}+dev"
          fi

          {
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "build_version=$build_version"
          } >> "$GITHUB_OUTPUT"
      - name: Ensure rolling tag and release exist
        if: ${{ github.event_name != 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          # Force-move the rolling tag to HEAD. For `release` events the tag
          # already exists at the right commit, so we skip this step entirely.
          git tag -f "$RELEASE_TAG"
          git push origin "$RELEASE_TAG" --force

          RELEASE_TITLE="Release archive testing"
          RELEASE_NOTES="Automated testing release for workflow development."
          if [ "$RELEASE_TAG" = "latest-commit-build" ]; then
            RELEASE_TITLE="Latest commit build"
            RELEASE_NOTES="Automated build from the latest commit on main branch. This release is updated automatically with every push to main."
          fi

          # Single-flight: this job is the only one that creates the release,
          # so the build matrix never races on `gh release create`.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --prerelease
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-latest}
          - {goos: linux, goarch: arm64, runner: ubuntu-latest}
          - {goos: linux, goarch: "386", runner: ubuntu-latest}
          - {goos: darwin, goarch: amd64, runner: macos-latest}
          - {goos: darwin, goarch: arm64, runner: macos-latest}
          - {goos: windows, goarch: amd64, runner: ubuntu-latest}
          - {goos: windows, goarch: arm64, runner: ubuntu-latest}
          - {goos: windows, goarch: "386", runner: ubuntu-latest}
    steps:
      - name: Check out code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.x
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BINARY_NAME="kargo-tui"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="kargo-tui.exe"
          fi

          go build -v \
            -ldflags "
              -X 'main.buildVersion=${{ needs.prepare-release.outputs.build_version }}'
              -X 'main.buildDate=$(date -u '+%Y-%m-%d %I:%M:%S %Z')'
              -X 'main.buildCommit=$(git rev-parse HEAD)'
            " \
            -trimpath -o "$BINARY_NAME" ./cmd/kargo-tui
      - name: Import Apple signing certificate
        if: ${{ matrix.goos == 'darwin' }}
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" ] || [ -z "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_KEYCHAIN_PASSWORD" ]; then
            echo "Missing required Apple signing secrets." >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -d > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Sign macOS binary
        if: ${{ matrix.goos == 'darwin' }}
        env:
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          if [ -z "$APPLE_DEVELOPER_IDENTITY" ]; then
            echo "Missing required Apple signing identity secret." >&2
            exit 1
          fi

          security find-identity -v -p codesigning
          codesign --force --options runtime --timestamp --sign "$APPLE_DEVELOPER_IDENTITY" "kargo-tui"
          codesign --verify --verbose=2 "kargo-tui"
      - name: Create archives
        run: |
          mkdir -p dist
          BINARY_NAME="kargo-tui"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="kargo-tui.exe"
          fi

          VERSION="${{ needs.prepare-release.outputs.version }}"
          ARCHIVE_BASE="kargo-tui_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"

          if [ "${{ matrix.goos }}" = "linux" ]; then
            tar -czvf "dist/${ARCHIVE_BASE}.tar.gz" "$BINARY_NAME"
          else
            zip "dist/${ARCHIVE_BASE}.zip" "$BINARY_NAME"
          fi
      - name: Notarize macOS archive
        if: ${{ matrix.goos == 'darwin' }}
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          if [ -z "$APPLE_NOTARY_ISSUER_ID" ] || [ -z "$APPLE_NOTARY_KEY_BASE64" ] || [ -z "$APPLE_NOTARY_KEY_ID" ]; then
            echo "Missing required Apple notarization secrets." >&2
            exit 1
          fi

          VERSION="${{ needs.prepare-release.outputs.version }}"
          ARCHIVE_PATH="dist/kargo-tui_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"

          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 -d > "$NOTARY_KEY_PATH"
          xcrun notarytool submit "$ARCHIVE_PATH" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          # Clean any existing assets for this os/arch so rebuilds replace
          # rather than accumulate alongside.
          PATTERN="_${{ matrix.goos }}_${{ matrix.goarch }}\."
          gh release view "$RELEASE_TAG" --json assets --jq ".assets[].name" | grep "$PATTERN" | while read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes || true
          done

          if [ "${{ matrix.goos }}" = "linux" ]; then
            gh release upload "$RELEASE_TAG" dist/kargo-tui_*.tar.gz --clobber
          else
            gh release upload "$RELEASE_TAG" dist/kargo-tui_*.zip --clobber
          fi

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Send email on failure
        uses: unknwon/send-email-on-failure@89339a1bc93f4ad1d30f3b7e4911fcba985c9adb # v1
        with:
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
