project: acme-commerce
argoCDURL: https://argocd.example.com

# 8 services, each with: qa -> staging -> trunk(control-flow) -> N regional prods,
# plus canary/internal/hotfix variations. 100 stages total, 8 control-flow.
warehouses:
  - name: wh-checkout
    git:   [{repoURL: "github.com/acme/checkout",      branch: main}]
    image: [{repoURL: "ghcr.io/acme/checkout"}]
  - name: wh-inventory
    git:   [{repoURL: "github.com/acme/inventory",     branch: main}]
    image: [{repoURL: "ghcr.io/acme/inventory"}]
  - name: wh-auth
    git:   [{repoURL: "github.com/acme/auth",          branch: main}]
    image: [{repoURL: "ghcr.io/acme/auth"}]
  - name: wh-search
    git:   [{repoURL: "github.com/acme/search",        branch: main}]
    image: [{repoURL: "ghcr.io/acme/search"}]
  - name: wh-payments
    git:   [{repoURL: "github.com/acme/payments",      branch: main}]
    image: [{repoURL: "ghcr.io/acme/payments"}]
  - name: wh-notifications
    git:   [{repoURL: "github.com/acme/notifications", branch: main}]
    image: [{repoURL: "ghcr.io/acme/notifications"}]
  - name: wh-orders
    git:   [{repoURL: "github.com/acme/orders",        branch: main}]
    image: [{repoURL: "ghcr.io/acme/orders"}]
  - name: wh-pricing
    git:   [{repoURL: "github.com/acme/pricing",       branch: main}]
    image: [{repoURL: "ghcr.io/acme/pricing"}]

stages:
  # ============================================================
  # checkout — 13 stages (qa, staging, trunk-ctl, 7 prods, canary, internal, hotfix)
  # ============================================================
  - {name: checkout-qa,            warehouses: [wh-checkout]}
  - {name: checkout-staging,       upstreams: [checkout-qa]}
  - {name: checkout-trunk,         upstreams: [checkout-staging], controlFlow: true}
  - {name: checkout-canary,        upstreams: [checkout-trunk]}
  - {name: checkout-internal,      upstreams: [checkout-trunk]}
  - {name: checkout-us-east-prod,  upstreams: [checkout-trunk]}
  - {name: checkout-us-west-prod,  upstreams: [checkout-trunk]}
  - {name: checkout-eu-west-prod,  upstreams: [checkout-trunk]}
  - {name: checkout-eu-north-prod, upstreams: [checkout-trunk]}
  - {name: checkout-ap-south-prod, upstreams: [checkout-trunk]}
  - {name: checkout-ap-east-prod,  upstreams: [checkout-trunk]}
  - {name: checkout-sa-east-prod,  upstreams: [checkout-trunk]}
  - {name: checkout-hotfix,        upstreams: [checkout-qa], requiresApproval: true}

  # ============================================================
  # inventory — 12 stages (qa, staging, trunk-ctl, 7 prods, canary, hotfix)
  # ============================================================
  - {name: inventory-qa,            warehouses: [wh-inventory]}
  - {name: inventory-staging,       upstreams: [inventory-qa]}
  - {name: inventory-trunk,         upstreams: [inventory-staging], controlFlow: true}
  - {name: inventory-canary,        upstreams: [inventory-trunk]}
  - {name: inventory-us-east-prod,  upstreams: [inventory-trunk]}
  - {name: inventory-us-west-prod,  upstreams: [inventory-trunk]}
  - {name: inventory-eu-west-prod,  upstreams: [inventory-trunk]}
  - {name: inventory-eu-north-prod, upstreams: [inventory-trunk]}
  - {name: inventory-ap-south-prod, upstreams: [inventory-trunk]}
  - {name: inventory-ap-east-prod,  upstreams: [inventory-trunk]}
  - {name: inventory-sa-east-prod,  upstreams: [inventory-trunk]}
  - {name: inventory-hotfix,        upstreams: [inventory-qa], requiresApproval: true}

  # ============================================================
  # auth — 14 stages (dev, qa, staging, trunk-ctl, 8 prods, canary, hotfix)
  # ============================================================
  - {name: auth-dev,            warehouses: [wh-auth]}
  - {name: auth-qa,             upstreams: [auth-dev]}
  - {name: auth-staging,        upstreams: [auth-qa]}
  - {name: auth-trunk,          upstreams: [auth-staging], controlFlow: true}
  - {name: auth-canary,         upstreams: [auth-trunk]}
  - {name: auth-us-east-prod,   upstreams: [auth-trunk]}
  - {name: auth-us-west-prod,   upstreams: [auth-trunk]}
  - {name: auth-us-central-prod, upstreams: [auth-trunk]}
  - {name: auth-eu-west-prod,   upstreams: [auth-trunk]}
  - {name: auth-eu-north-prod,  upstreams: [auth-trunk]}
  - {name: auth-ap-south-prod,  upstreams: [auth-trunk]}
  - {name: auth-ap-east-prod,   upstreams: [auth-trunk]}
  - {name: auth-sa-east-prod,   upstreams: [auth-trunk]}
  - {name: auth-hotfix,         upstreams: [auth-qa], requiresApproval: true}

  # ============================================================
  # search — 12 stages
  # ============================================================
  - {name: search-qa,            warehouses: [wh-search]}
  - {name: search-staging,       upstreams: [search-qa]}
  - {name: search-trunk,         upstreams: [search-staging], controlFlow: true}
  - {name: search-canary,        upstreams: [search-trunk]}
  - {name: search-us-east-prod,  upstreams: [search-trunk]}
  - {name: search-us-west-prod,  upstreams: [search-trunk]}
  - {name: search-eu-west-prod,  upstreams: [search-trunk]}
  - {name: search-eu-north-prod, upstreams: [search-trunk]}
  - {name: search-ap-south-prod, upstreams: [search-trunk]}
  - {name: search-ap-east-prod,  upstreams: [search-trunk]}
  - {name: search-sa-east-prod,  upstreams: [search-trunk]}
  - {name: search-hotfix,        upstreams: [search-qa], requiresApproval: true}

  # ============================================================
  # payments — 13 stages (extra "internal" tier for compliance demos)
  # ============================================================
  - {name: payments-qa,            warehouses: [wh-payments]}
  - {name: payments-staging,       upstreams: [payments-qa]}
  - {name: payments-trunk,         upstreams: [payments-staging], controlFlow: true}
  - {name: payments-canary,        upstreams: [payments-trunk]}
  - {name: payments-internal,      upstreams: [payments-trunk]}
  - {name: payments-us-east-prod,  upstreams: [payments-trunk], requiresApproval: true}
  - {name: payments-us-west-prod,  upstreams: [payments-trunk], requiresApproval: true}
  - {name: payments-eu-west-prod,  upstreams: [payments-trunk], requiresApproval: true}
  - {name: payments-eu-north-prod, upstreams: [payments-trunk], requiresApproval: true}
  - {name: payments-ap-south-prod, upstreams: [payments-trunk], requiresApproval: true}
  - {name: payments-ap-east-prod,  upstreams: [payments-trunk], requiresApproval: true}
  - {name: payments-sa-east-prod,  upstreams: [payments-trunk], requiresApproval: true}
  - {name: payments-hotfix,        upstreams: [payments-qa], requiresApproval: true}

  # ============================================================
  # notifications — 12 stages
  # ============================================================
  - {name: notifications-qa,            warehouses: [wh-notifications]}
  - {name: notifications-staging,       upstreams: [notifications-qa]}
  - {name: notifications-trunk,         upstreams: [notifications-staging], controlFlow: true}
  - {name: notifications-canary,        upstreams: [notifications-trunk]}
  - {name: notifications-us-east-prod,  upstreams: [notifications-trunk]}
  - {name: notifications-us-west-prod,  upstreams: [notifications-trunk]}
  - {name: notifications-eu-west-prod,  upstreams: [notifications-trunk]}
  - {name: notifications-eu-north-prod, upstreams: [notifications-trunk]}
  - {name: notifications-ap-south-prod, upstreams: [notifications-trunk]}
  - {name: notifications-ap-east-prod,  upstreams: [notifications-trunk]}
  - {name: notifications-sa-east-prod,  upstreams: [notifications-trunk]}
  - {name: notifications-hotfix,        upstreams: [notifications-qa], requiresApproval: true}

  # ============================================================
  # orders — 12 stages
  # ============================================================
  - {name: orders-qa,            warehouses: [wh-orders]}
  - {name: orders-staging,       upstreams: [orders-qa]}
  - {name: orders-trunk,         upstreams: [orders-staging], controlFlow: true}
  - {name: orders-canary,        upstreams: [orders-trunk]}
  - {name: orders-us-east-prod,  upstreams: [orders-trunk]}
  - {name: orders-us-west-prod,  upstreams: [orders-trunk]}
  - {name: orders-eu-west-prod,  upstreams: [orders-trunk]}
  - {name: orders-eu-north-prod, upstreams: [orders-trunk]}
  - {name: orders-ap-south-prod, upstreams: [orders-trunk]}
  - {name: orders-ap-east-prod,  upstreams: [orders-trunk]}
  - {name: orders-sa-east-prod,  upstreams: [orders-trunk]}
  - {name: orders-hotfix,        upstreams: [orders-qa], requiresApproval: true}

  # ============================================================
  # pricing — 12 stages
  # ============================================================
  - {name: pricing-qa,            warehouses: [wh-pricing]}
  - {name: pricing-staging,       upstreams: [pricing-qa]}
  - {name: pricing-trunk,         upstreams: [pricing-staging], controlFlow: true}
  - {name: pricing-canary,        upstreams: [pricing-trunk]}
  - {name: pricing-us-east-prod,  upstreams: [pricing-trunk]}
  - {name: pricing-us-west-prod,  upstreams: [pricing-trunk]}
  - {name: pricing-eu-west-prod,  upstreams: [pricing-trunk]}
  - {name: pricing-eu-north-prod, upstreams: [pricing-trunk]}
  - {name: pricing-ap-south-prod, upstreams: [pricing-trunk]}
  - {name: pricing-ap-east-prod,  upstreams: [pricing-trunk]}
  - {name: pricing-sa-east-prod,  upstreams: [pricing-trunk]}
  - {name: pricing-hotfix,        upstreams: [pricing-qa], requiresApproval: true}
